<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>スター検索</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="icon" href="https://cdn-icons-png.freepik.com/256/18716/18716170.png?semt=ais_white_label" sizes="16×16" type="image/png" />  
<style>
:root{
  --bg:#0f172a; --card:#020617; --text:#fff; --accent:#22c55e;
}
.light{
  --bg:#f1f5f9; --card:#fff; --text:#020617; --accent:#2563eb;
}
body{
  margin:0;font-family:system-ui,sans-serif;
  background:var(--bg);color:var(--text);
}
.container{
  max-width:560px;margin:24px auto;padding:20px;
  background:var(--card);border-radius:14px;
}
input,select,button{
  width:100%;padding:12px;margin-top:10px;
  border:none;border-radius:8px;font-size:15px;
}
button{cursor:pointer}
.search{background:var(--accent);color:#fff;}
.mode{background:#64748b;color:#fff;}
.warn{background:#ef4444;color:#fff;}
.theme{background:#a855f7;color:#fff;}
.history{display:none;margin-top:18px;}
.item{
  background:rgba(0,0,0,.2);
  padding:10px;border-radius:8px;margin-bottom:8px;
}
.time{font-size:12px;opacity:.7;}
.status{text-align:center;margin-top:10px;}
.timer{text-align:center;font-size:13px;opacity:.8;}
   footer {
           padding: 30px;
           text-align: center;
           font-size: 0.85rem;
           color: rgba(255,255,255,0.5);
           border-top: 1px solid rgba(255,255,255,0.1);
           margin-top: 60px;
   }
</style>
</head>
<body>

<div class="container">
<h1>スター検索</h1>

<select id="engine">
  <option value="google">Google</option>
  <option value="yahoo">Yahoo! JAPAN</option>
  <option value="bing">Bing</option>
  <option value="duck">DuckDuckGo</option>
</select>

<input id="q" placeholder="検索内容を入力">
<button class="search" onclick="search()">検索</button>

<hr>

<button class="mode" onclick="adminLogin()">管理者モード切替</button>
<button class="warn" onclick="forgotPassword()">パスワードがわからない場合</button>
<button class="theme" onclick="toggleTheme()">ダーク / ライト切替</button>

<div class="status" id="status">通常モード</div>
<div class="timer" id="timer"></div>

<div class="history" id="historyBox">
  <h3>検索履歴（管理者）</h3>
  <div id="history"></div>
  <button class="warn" onclick="logoutAdmin()">管理者ログアウト</button>
</div>
</div>
   <footer>
       © 2025 STAR TOOLS - All Rights Reserved.
   </footer>


<script>
/* ===== Keys ===== */
const HISTORY_KEY="searchHistory";
const PASS_KEY="adminPassHash";
const RESET_KEY="resetExpire";
const THEME_KEY="theme";

/* ===== State ===== */
let admin=false;
let tick=null;

/* ===== Search ===== */
function search(){
  const q=document.getElementById("q").value.trim();
  if(!q) return;

  const map={
    google:"https://www.google.com/search?q=",
    yahoo:"https://search.yahoo.co.jp/search?p=",
    bing:"https://www.bing.com/search?q=",
    duck:"https://duckduckgo.com/?q="
  };

  const data=JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]");
  data.unshift({text:q,time:new Date().toLocaleString()});
  localStorage.setItem(HISTORY_KEY,JSON.stringify(data));

  window.open(map[engine.value]+encodeURIComponent(q),"_blank");
  q.value="";
  render();
}

/* ===== Admin Login ===== */
async function adminLogin(){
  const saved=localStorage.getItem(PASS_KEY);

  if(!saved){
    const p=prompt("管理者パスワードを設定");
    if(!p) return;
    localStorage.setItem(PASS_KEY,await hash(p));
    alert("設定しました");
    return;
  }

  const input=prompt("管理者パスワード");
  if(await hash(input)!==saved){
    alert("パスワードが違います");
    return;
  }
  enableAdmin();
}

/* ===== Enable / Disable ===== */
function enableAdmin(){
  admin=true;
  document.getElementById("historyBox").style.display="block";
  document.getElementById("status").textContent="管理者モード";
  render();
}
function logoutAdmin(){
  admin=false;
  document.getElementById("historyBox").style.display="none";
  document.getElementById("status").textContent="通常モード";
}

/* ===== Forgot Password (5分) ===== */
function forgotPassword(){
  if(localStorage.getItem(RESET_KEY)){
    alert("すでに待機中です");
    return;
  }
  const expire=Date.now()+5*60*1000;
  localStorage.setItem(RESET_KEY,expire);
  startResetTimer();
}

function startResetTimer(){
  clearInterval(tick);
  tick=setInterval(()=>{
    const exp=Number(localStorage.getItem(RESET_KEY));
    const left=exp-Date.now();
    if(left<=0){
      clearInterval(tick);
      localStorage.removeItem(PASS_KEY);
      localStorage.removeItem(RESET_KEY);
      document.getElementById("timer").textContent="";
      alert("パスワードがリセットされました。再設定してください。");
      return;
    }
    const m=Math.floor(left/60000);
    const s=Math.floor((left%60000)/1000);
    document.getElementById("timer").textContent=
      `パスワードリセットまで ${m}:${s.toString().padStart(2,"0")}`;
  },1000);
}

/* ===== History ===== */
function render(){
  if(!admin) return;
  const box=document.getElementById("history");
  box.innerHTML="";
  const data=JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]");
  data.forEach(d=>{
    box.innerHTML+=`
      <div class="item">
        <div>${d.text}</div>
        <div class="time">${d.time}</div>
      </div>`;
  });
}

/* ===== Theme ===== */
function toggleTheme(){
  document.body.classList.toggle("light");
  localStorage.setItem(THEME_KEY,
    document.body.classList.contains("light")?"light":"dark");
}

/* ===== Hash ===== */
async function hash(t){
  const b=new TextEncoder().encode(t);
  const d=await crypto.subtle.digest("SHA-256",b);
  return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,"0")).join("");
}

/* ===== Restore Reset Timer ===== */
if(localStorage.getItem(RESET_KEY)){
  startResetTimer();
}
</script>

</body>
</html>
